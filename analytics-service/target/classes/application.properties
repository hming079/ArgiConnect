spring.application.name=analytics-service
server.port=${PORT:8083}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/agriconnect}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=analytics_schema
spring.flyway.schemas=analytics_schema
spring.flyway.default-schema=analytics_schema
spring.flyway.create-schemas=true
jwt.secret=${JWT_SECRET}
core.url=${CORE_SERVICE_URL:http://localhost:8082}
crop.url=${CROP_SERVICE_URL:http://localhost:8084}
rescue.url=${RESCUE_SERVICE_URL:http://localhost:8085}
order.url=${ORDER_SERVICE_URL:http://localhost:8086}
logistics.url=${LOGISTICS_SERVICE_URL:http://localhost:8087}
internal.api-key=${INTERNAL_API_KEY}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false
events.exchange=${EVENTS_EXCHANGE:agriconnect.events}
management.endpoints.web.exposure.include=health,info,metrics
server.error.include-stacktrace=never
