spring.application.name=notification-service
server.port=${PORT:8088}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/agriconnect}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=notification_schema
spring.flyway.schemas=notification_schema
spring.flyway.default-schema=notification_schema
spring.flyway.create-schemas=true
jwt.secret=${JWT_SECRET}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false
events.exchange=${EVENTS_EXCHANGE:agriconnect.events}
management.endpoints.web.exposure.include=health,info,metrics
server.error.include-stacktrace=never
