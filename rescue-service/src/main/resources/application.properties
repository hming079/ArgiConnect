spring.application.name=rescue-service
server.port=${PORT:8085}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/agriconnect}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.schema=rescue_schema
spring.flyway.schemas=rescue_schema
spring.flyway.default-schema=rescue_schema
spring.flyway.create-schemas=true
jwt.secret=${JWT_SECRET}
internal.api-key=${INTERNAL_API_KEY}
crop-service.url=${CROP_SERVICE_URL:http://localhost:8084}
management.endpoints.web.exposure.include=health,info,metrics
server.error.include-stacktrace=never
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
events.exchange=${EVENTS_EXCHANGE:agriconnect.events}
outbox.publish-delay-ms=${OUTBOX_PUBLISH_DELAY_MS:1000}
