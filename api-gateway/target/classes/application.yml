server:
  port: ${PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: [Authorization, Content-Type, Accept, Idempotency-Key, X-Trace-Id]
            exposedHeaders: [X-Trace-Id]
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
      default-filters:
        - name: Retry
          args:
            retries: 2
            methods: GET
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: false
        - name: DedupeResponseHeader
          args:
            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
            strategy: RETAIN_FIRST
        - name: CircuitBreaker
          args:
            name: downstream
            fallbackUri: forward:/fallback/downstream
services:
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  core-url: ${CORE_SERVICE_URL:http://localhost:8082}
  analytics-url: ${ANALYTICS_SERVICE_URL:http://localhost:8083}
  crop-url: ${CROP_SERVICE_URL:http://localhost:8084}
  rescue-url: ${RESCUE_SERVICE_URL:http://localhost:8085}
  order-url: ${ORDER_SERVICE_URL:http://localhost:8086}
  logistics-url: ${LOGISTICS_SERVICE_URL:http://localhost:8087}
  notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8088}
management:
  endpoints.web.exposure.include: health,info,gateway,metrics
  endpoint.health.probes.enabled: true
